[build]
  publish = "frontend"

# Proxy API + report assets to the Render backend.
# After the first Render deploy, replace the hostname below with the real
# service URL shown in the Render dashboard.
[[redirects]]
  from = "/api/*"
  to = "https://it-job-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/reports/*"
  to = "https://it-job-backend.onrender.com/reports/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
