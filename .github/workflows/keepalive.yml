name: Keep Render backend awake

# Render free tier spins down after 15 minutes of no traffic and takes ~50s
# to wake — longer than Netlify's 26s proxy timeout, so a sleeping backend
# looks like a broken dashboard to the first visitor.
#
# This workflow pings the health endpoint every 10 minutes AROUND THE CLOCK,
# keeping the service warm 24/7: at most 744 instance-hours in a 31-day month,
# which fits Render's 750h/month free budget ONLY IF this is the account's
# single free web service. Do not add a second free service to this Render
# account, or both will be suspended mid-month when the shared budget runs out.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            https://itjob-trend-predict-realtime.onrender.com/api/health)
          echo "Health check returned HTTP $code"
          test "$code" = "200"
